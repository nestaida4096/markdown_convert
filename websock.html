<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Stream Receiver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .stream-container {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }
        #status-indicator {
            transition: all 0.3s ease;
        }
        /* 拡大表示用のトランジション */
        #lightbox-overlay {
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <header class="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-blue-400">Media Stream Client</h1>
            <p class="text-slate-400 text-sm">Discord Bot Custom Media Protocol</p>
        </div>
        <div class="flex items-center gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div class="flex flex-col">
                <label class="text-xs text-slate-500 uppercase font-bold">WebSocket URL</label>
                <input id="ws-url" type="text" value="ws://localhost:8765" class="bg-transparent border-none focus:ring-0 text-sm w-48 text-white">
            </div>
            <button id="connect-btn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-bold transition-colors">
                接続
            </button>
            <div id="status-indicator" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto">
        <div id="streams-grid" class="grid stream-container gap-6">
            <!-- ストリームがここに動的に追加されます -->
            <div id="empty-state" class="col-span-full py-20 text-center border-2 border-dashed border-slate-800 rounded-3xl">
                <p class="text-slate-500">WebSocketに接続して配信を開始してください</p>
            </div>
        </div>
    </main>

    <!-- ライトボックス・オーバーレイ -->
    <div id="lightbox-overlay" class="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center hidden opacity-0">
        <button id="close-lightbox" class="absolute top-6 right-6 text-white hover:text-blue-400 transition-colors p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <div id="lightbox-content" class="w-full h-full p-4 flex flex-col items-center justify-center">
            <h2 id="lightbox-title" class="text-blue-400 font-mono mb-4 text-xl font-bold"></h2>
            <img id="lightbox-img" class="max-w-full max-h-[85vh] object-contain shadow-2xl rounded-sm" src="" alt="Stream Full View">
        </div>
    </div>

    <script>
        let socket = null;
        let audioCtx = null;
        const streams = new Map(); // targetId -> { cardElement, imgElement, nextStartTime, lastSeen }
        
        const TIMEOUT_MS = 5000; // 5秒間データが来なければ削除
        
        // ライトボックス管理用
        let activeFullscreenId = null;

        const wsUrlInput = document.getElementById('ws-url');
        const connectBtn = document.getElementById('connect-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const streamsGrid = document.getElementById('streams-grid');
        const emptyState = document.getElementById('empty-state');
        
        const lightbox = document.getElementById('lightbox-overlay');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const closeLightboxBtn = document.getElementById('close-lightbox');

        // 音声コンテキストの初期化
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ライトボックスを開く
        function openLightbox(targetId) {
            activeFullscreenId = targetId;
            const sourceImg = document.getElementById(`img-${targetId}`);
            if (!sourceImg) return;
            
            lightboxImg.src = sourceImg.src;
            lightboxTitle.textContent = `Streaming: ${targetId}`;
            
            lightbox.classList.remove('hidden');
            setTimeout(() => {
                lightbox.classList.remove('opacity-0');
                lightbox.classList.add('opacity-100');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        // ライトボックスを閉じる
        function closeLightbox() {
            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightboxImg.src = "";
                activeFullscreenId = null;
            }, 300);
            document.body.style.overflow = '';
        }

        lightbox.onclick = (e) => {
            if (e.target === lightbox || e.target === document.getElementById('lightbox-content')) {
                closeLightbox();
            }
        };
        closeLightboxBtn.onclick = closeLightbox;

        // ストリームの削除処理
        function removeStream(targetId) {
            const streamInfo = streams.get(targetId);
            if (streamInfo) {
                if (streamInfo.img.src.startsWith('blob:')) {
                    URL.revokeObjectURL(streamInfo.img.src);
                }
                streamInfo.card.remove();
                streams.delete(targetId);
                
                // ライトボックス表示中のストリームが消えたら閉じる
                if (activeFullscreenId === targetId) {
                    closeLightbox();
                }
                
                // 全てなくなったら空の状態を表示
                if (streams.size === 0) {
                    emptyState.style.display = 'block';
                }
            }
        }

        // タイムアウト監視（1秒おきにチェック）
        setInterval(() => {
            const now = Date.now();
            for (const [targetId, info] of streams.entries()) {
                if (now - info.lastSeen > TIMEOUT_MS) {
                    console.log(`Stream timeout: ${targetId}`);
                    removeStream(targetId);
                }
            }
        }, 1000);

        function createStreamUI(targetId) {
            emptyState.style.display = 'none';
            
            const card = document.createElement('div');
            card.className = "bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-xl transition-all duration-500";
            card.innerHTML = `
                <div class="p-3 bg-slate-700/50 flex justify-between items-center">
                    <span class="font-mono text-xs font-bold text-blue-300 tracking-wider">${targetId}</span>
                    <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded uppercase">Live</span>
                </div>
                <div class="aspect-video bg-black flex items-center justify-center relative group cursor-pointer overflow-hidden">
                    <img id="img-${targetId}" class="w-full h-full object-contain transition-transform duration-500 group-hover:scale-105" />
                    <div id="no-video-${targetId}" class="absolute inset-0 flex items-center justify-center text-slate-600 italic text-sm bg-slate-900">
                        Waiting for visual...
                    </div>
                    <div class="absolute inset-0 bg-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <span class="bg-black/60 text-white px-4 py-2 rounded-full text-sm font-bold backdrop-blur-sm border border-white/20">
                            拡大表示
                        </span>
                    </div>
                </div>
                <div class="p-4 flex items-center gap-3">
                    <div class="flex-1 h-1 bg-slate-700 rounded-full overflow-hidden">
                        <div id="audio-meter-${targetId}" class="h-full bg-blue-500 w-0 transition-all duration-100"></div>
                    </div>
                    <span class="text-[10px] text-slate-500 font-mono uppercase">Audio Level</span>
                </div>
            `;
            
            const imageContainer = card.querySelector('.aspect-video');
            imageContainer.onclick = () => openLightbox(targetId);
            
            streamsGrid.appendChild(card);

            return {
                card: card,
                img: document.getElementById(`img-${targetId}`),
                noVideo: document.getElementById(`no-video-${targetId}`),
                meter: document.getElementById(`audio-meter-${targetId}`),
                nextStartTime: 0,
                lastSeen: Date.now()
            };
        }

        function connect() {
            initAudio();
            
            if (socket) {
                socket.close();
            }

            const url = wsUrlInput.value;
            socket = new WebSocket(url);
            socket.binaryType = 'arraybuffer';

            socket.onopen = () => {
                console.log('Connected to Broadcaster');
                statusIndicator.className = "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.5)]";
                connectBtn.textContent = '切断';
            };

            socket.onclose = () => {
                console.log('Disconnected');
                statusIndicator.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]";
                connectBtn.textContent = '接続';
                // 接続が切れたら全てのストリームをクリア
                for (const targetId of streams.keys()) {
                    removeStream(targetId);
                }
            };

            socket.onmessage = async (event) => {
                const buffer = event.data;
                const view = new DataView(buffer);

                if (buffer.byteLength < 13) return;

                const type = view.getUint8(0);
                const targetLen = view.getUint32(9, true);
                
                const targetIdBuf = new Uint8Array(buffer, 13, targetLen);
                const targetId = new TextDecoder().decode(targetIdBuf);
                const payload = new Uint8Array(buffer, 13 + targetLen);

                if (!streams.has(targetId)) {
                    streams.set(targetId, createStreamUI(targetId));
                }
                const streamInfo = streams.get(targetId);
                
                // データの受信時刻を更新
                streamInfo.lastSeen = Date.now();

                if (type === 1) { // Image (MJPEG)
                    const blob = new Blob([payload], { type: 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    
                    const oldUrl = streamInfo.img.src;
                    streamInfo.img.src = url;
                    
                    if (activeFullscreenId === targetId) {
                        lightboxImg.src = url;
                    }

                    streamInfo.noVideo.style.display = 'none';
                    if (oldUrl.startsWith('blob:')) URL.revokeObjectURL(oldUrl);
                    
                } else if (type === 0) { // Audio (PCM s16le)
                    playPCM(payload, streamInfo);
                }
            };
        }

        function playPCM(payload, streamInfo) {
            if (!audioCtx) return;

            const int16Data = new Int16Array(payload.buffer, payload.byteOffset, payload.byteLength / 2);
            const f32Data = new Float32Array(int16Data.length);
            
            let sum = 0;
            for (let i = 0; i < int16Data.length; i++) {
                f32Data[i] = int16Data[i] / 32768.0;
                sum += Math.abs(f32Data[i]);
            }

            const volume = (sum / int16Data.length) * 500;
            streamInfo.meter.style.width = Math.min(100, volume) + '%';

            const audioBuffer = audioCtx.createBuffer(1, f32Data.length, 48000);
            audioBuffer.getChannelData(0).set(f32Data);

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);

            const currentTime = audioCtx.currentTime;
            if (streamInfo.nextStartTime < currentTime) {
                streamInfo.nextStartTime = currentTime + 0.05;
            }

            source.start(streamInfo.nextStartTime);
            streamInfo.nextStartTime += audioBuffer.duration;
        }

        connectBtn.onclick = () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            } else {
                connect();
            }
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
